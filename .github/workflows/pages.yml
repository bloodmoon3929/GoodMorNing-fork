name: Deploy Flutter web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Bundle original prototype and static 3D assets
        run: python3 scripts/prepare_frontend.py
      - run: flutter pub get
        working-directory: app
      - name: Configure automatic GPU connection
        env:
          GOODMORNING_GPU_URL: ${{ vars.GPU_API_URL }}
        run: python3 scripts/write_connection.py
      - name: Build Flutter for repository URL
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
