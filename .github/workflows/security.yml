name: Check repository for secrets
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Reject private files and scan all reachable history
        run: |
          python3 scripts/check_secrets.py --history
          gitleaks git --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow
      - name: Scan pinned upstream source contents
        run: |
          gitleaks dir prototype --redact=100 --no-banner --ignore-gitleaks-allow
          gitleaks dir sticker-engine --redact=100 --no-banner --ignore-gitleaks-allow
